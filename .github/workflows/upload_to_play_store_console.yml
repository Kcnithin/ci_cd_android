name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ✅ Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Install Android SDK (PROPER FIX)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Accept licenses + install required SDK
      - name: Install SDK components
        shell: pwsh
        run: |
          sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ✅ Decode Keystore
      - name: Decode Keystore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android/app
          [IO.File]::WriteAllBytes("android/app/keystore.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      # ✅ Decode Play Store JSON
      - name: Decode Play Store JSON
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("play-store-key.json", [Convert]::FromBase64String("${{ secrets.PLAY_STORE_JSON_KEY }}"))

      # ✅ FIXED SDK path
      - name: Create local.properties
        shell: pwsh
        run: |
          $sdkPath = $env:ANDROID_SDK_ROOT -replace '\\', '/'
          echo "sdk.dir=$sdkPath" > local.properties

      # ✅ Debug SDK path
      - name: Verify SDK path
        shell: pwsh
        run: |
          Get-Content local.properties

      # ✅ Verify keystore
      - name: Verify keystore
        shell: pwsh
        run: |
          Get-ChildItem android/app

      # ✅ Version code
      - name: Set version code
        shell: pwsh
        run: |
          echo "VERSION_CODE=2" >> $env:GITHUB_ENV

      # ✅ Clean
      - name: Clean
        run: ./gradlew clean

      # ✅ Build AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --debug
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ✅ Debug build output
      - name: Debug Build Folder
        shell: pwsh
        run: |
          if (Test-Path "android/app/build") {
            Get-ChildItem android/app/build -Recurse -Depth 3
          } else {
            Write-Host "Build folder not found"
          }

      # ✅ Verify AAB
      - name: Verify AAB
        shell: pwsh
        run: |
          if (Test-Path "android/app/build/outputs/bundle/release") {
            Get-ChildItem android/app/build/outputs/bundle/release
          } else {
            Write-Host "AAB folder not found"
          }

      # ✅ Upload
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed