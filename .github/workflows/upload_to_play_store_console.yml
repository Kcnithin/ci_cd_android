name: Android CI/CD

on:
  workflow_dispatch:   # ✅ enables manual trigger with branch selection
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # ✅ Decode Keystore
      - name: Decode Keystore
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("app/keystore.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      # ✅ Decode Play Store JSON
      - name: Decode Play Store JSON
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("play-store-key.json", [Convert]::FromBase64String("${{ secrets.PLAY_STORE_JSON_KEY }}"))

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ Get latest versionCode from Play Store
      - name: Get latest version code
        id: version
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          track: internal
          status: draft
        continue-on-error: true

      # ✅ Generate next versionCode
      - name: Increment version code
        id: increment
        run: |
          VERSION_CODE=$((${{ steps.version.outputs.versionCode }} + 1))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      # ✅ Update versionCode in gradle
      - name: Update versionCode
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" app/build.gradle

      # ✅ Build AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ✅ Upload to Play Store
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed