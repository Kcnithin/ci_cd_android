name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. CHECKOUT REPO
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. SETUP JAVA 17
      # -----------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -----------------------------
      # 3. INSTALL ANDROID SDK
      # -----------------------------
      - name: Install Android SDK Command Line Tools
        run: |
          sudo mkdir -p /usr/lib/android-sdk/cmdline-tools
          cd /usr/lib/android-sdk/cmdline-tools
          
          sudo wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo unzip cmdline-tools.zip
          sudo rm cmdline-tools.zip
          
          sudo mv cmdline-tools latest

          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "PATH=/usr/lib/android-sdk/cmdline-tools/latest/bin:/usr/lib/android-sdk/platform-tools:/usr/lib/android-sdk/emulator:$PATH" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          source $GITHUB_ENV
          yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          source $GITHUB_ENV
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # -----------------------------
      # 4. DECODE KEYSTORE
      # -----------------------------
      - name: Decode Keystore
        run: |
          mkdir -p keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystores/cicd-keystore.jks

      # -----------------------------
      # 5. DECODE GOOGLE PLAY JSON
      # -----------------------------
      - name: Decode Play Store JSON
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      # -----------------------------
      # 6. CREATE local.properties
      # -----------------------------
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # -----------------------------
      # 7. MAKE gradlew EXECUTABLE
      # -----------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # -----------------------------
      # 8. GRADLE CLEAN
      # -----------------------------
      - name: Clean
        run: ./gradlew clean
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # -----------------------------
      # 9. BUILD RELEASE AAB
      # -----------------------------
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --debug
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # -----------------------------
      # 10. VERIFY AAB EXISTS
      # -----------------------------
      - name: Ensure AAB exists
        run: |
          echo "Generated AAB files:"
          ls -R app/build/outputs/bundle/release

      # -----------------------------
      # 11. UPLOAD TO GOOGLE PLAY
      # -----------------------------
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed