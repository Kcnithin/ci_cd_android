name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        shell: pwsh
        run: |
          sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Keystore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android/app
          [IO.File]::WriteAllBytes("android/app/keystore.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      - name: Decode Play Store JSON
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("play-store-key.json", [Convert]::FromBase64String("${{ secrets.PLAY_STORE_JSON_KEY }}"))

      - name: Create local.properties
        shell: pwsh
        run: |
          $sdkPath = $env:ANDROID_SDK_ROOT -replace '\\', '/'
          echo "sdk.dir=$sdkPath" > local.properties

      - name: Set version code
        shell: pwsh
        run: |
          echo "VERSION_CODE=2" >> $env:GITHUB_ENV

      # ✅ Clean (FINAL FIX)
      - name: Clean
        working-directory: android
        run: .\gradlew.bat clean

      # ✅ Build (FINAL FIX)
      - name: Build Release AAB
        working-directory: android
        run: .\gradlew.bat bundleRelease --stacktrace --debug
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Ensure AAB exists
        shell: pwsh
        run: |
          $files = Get-ChildItem android/app/build -Recurse -Filter *.aab -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "AAB not generated. Build failed."
            exit 1
          } else {
            $files
          }

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed