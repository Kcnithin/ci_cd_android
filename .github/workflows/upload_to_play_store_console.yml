name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------
      # Checkout Code
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Java & Android SDK
      # ----------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ----------------------------------------------
      # Decode Keystore (correct location)
      # ----------------------------------------------
      - name: Decode Keystore
        run: |
          mkdir -p app/keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystores/cicd-keystore.jks

      # ----------------------------------------------
      # Decode Play Store JSON
      # ----------------------------------------------
      - name: Decode Play Store JSON
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      # ----------------------------------------------
      # Clean JSON
      # ----------------------------------------------
      - name: Clean Play Store JSON
        run: |
          tr -d '\000' < play-store-key.json | sed 's/\r$//' > clean.json
          mv clean.json play-store-key.json

      # ----------------------------------------------
      # Validate Play Store JSON
      # ----------------------------------------------
      - name: Validate Play Store JSON
        run: |
          echo "Validating play-store-key.json..."
          cat play-store-key.json | jq empty
          echo "✅ JSON is valid and clean."

      # ----------------------------------------------
      # Gradle Setup
      # ----------------------------------------------
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ----------------------------------------------
      # Clean & Build Release AAB
      # ----------------------------------------------
      - name: Clean
        run: ./gradlew clean --stacktrace
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks   # FIXED
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --info
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks   # FIXED
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ----------------------------------------------
      # Verify AAB Output
      # ----------------------------------------------
      - name: Ensure AAB exists
        run: |
          echo "Generated AAB files:"
          ls -R app/build/outputs/bundle/release

      # ----------------------------------------------
      # Upload to Google Play
      # ----------------------------------------------
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ github.workspace }}/play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/**/*.aab   # FIXED
          track: ${{ github.event.inputs.track }}
          status: completed