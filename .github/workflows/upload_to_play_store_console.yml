name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # ✅ Decode Keystore (FIXED PATH)
      - name: Decode Keystore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android/app
          [IO.File]::WriteAllBytes("android/app/keystore.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      # ✅ Decode Play Store JSON
      - name: Decode Play Store JSON
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("play-store-key.json", [Convert]::FromBase64String("${{ secrets.PLAY_STORE_JSON_KEY }}"))

      # ✅ Create local.properties
      - name: Create local.properties
        shell: pwsh
        run: |
          echo "sdk.dir=$env:ANDROID_HOME" > local.properties

      # ❌ REMOVE chmod (not needed on Windows)

      # ✅ Verify keystore exists
      - name: Verify keystore
        shell: pwsh
        run: |
          Get-ChildItem android/app

      # ❌ REMOVE this step (causes confusion + unnecessary API call)
      # - name: Get latest version code

      # ✅ Set versionCode safely
      - name: Set version code
        shell: pwsh
        run: |
          echo "VERSION_CODE=2" >> $env:GITHUB_ENV

      # ✅ Clean build (IMPORTANT)
      - name: Clean
        run: ./gradlew clean

      # ✅ Build AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --info
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ✅ Verify AAB exists
      - name: Verify AAB
        shell: pwsh
        run: |
          Get-ChildItem android/app/build/outputs/bundle/release

      # ✅ Upload to Play Store (FIXED PATH)
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed