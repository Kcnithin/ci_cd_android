name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK (clean + stable)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept licenses FIRST ✅
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # Install required SDKs ✅
      - name: Install SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # Decode keystore
      - name: Decode Keystore
        run: |
          mkdir -p app/keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystores/cicd-keystore.jks

      # Decode Play Store JSON
      - name: Decode Play Store JSON
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > play-store-key.json

      # local.properties (important for Gradle)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Clean build
      - name: Clean
        run: ./gradlew clean --stacktrace
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Build AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --info
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Verify output
      - name: Ensure AAB exists
        run: |
          echo "Generated AAB files:"
          ls -R app/build/outputs/bundle/release

      # Upload to Play Store
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed