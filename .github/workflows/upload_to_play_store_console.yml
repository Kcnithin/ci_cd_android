name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Java & Android SDK
      # ----------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # ----------------------------------------------
      # Decode Keystore
      # ----------------------------------------------
      - name: Decode Keystore
        run: |
          mkdir -p app/keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystores/cicd-keystore.jks

      # ----------------------------------------------
      # Setup Play Store JSON
      # ----------------------------------------------
      - name: Setup Play Store JSON
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAYSTORE_JSON }}
        run: |
          if echo "$PLAY_STORE_JSON" | base64 --decode > play-store-key.json 2>/dev/null \
            && jq -e . play-store-key.json >/dev/null 2>&1; then
            echo "Decoded JSON from base64."
          else
            echo "$PLAY_STORE_JSON" > play-store-key.json
          fi

      # ----------------------------------------------
      # Install Fastlane
      # ----------------------------------------------
      - name: Install Fastlane
        run: sudo gem install fastlane -N

      # ----------------------------------------------
      # Fetch current Play Store versionCode
      # ----------------------------------------------
      - name: Fetch versionCode from Play Store
        id: fetch_version
        run: |
          echo "Fetching versionCode..."
          JSON_KEY="$GITHUB_WORKSPACE/play-store-key.json"

          VERSION_CODE=$(fastlane supply \
            --package_name com.cicd.seeroo_sample \
            --json_key $JSON_KEY \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_apk \
            --skip_upload_aab \
            --format json \
            --print_current_version | jq '.tracks[].releases[].versionCodes[0]' | sort -nr | head -1)

          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = "null" ]; then
            VERSION_CODE=1
          fi

          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          echo "New Version Code: $NEW_VERSION_CODE"
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      # ----------------------------------------------
      # Gradle Setup
      # ----------------------------------------------
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ----------------------------------------------
      # Build AAB
      # ----------------------------------------------
      - name: Build Release AAB
        run: ./gradlew bundleRelease --info -PversionCode=$VERSION_CODE
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ----------------------------------------------
      # Verify AAB
      # ----------------------------------------------
      - name: Ensure AAB exists
        run: ls -R app/build/outputs/bundle/release

      # ----------------------------------------------
      # Upload to Google Play
      # ----------------------------------------------
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ github.workspace }}/play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/**/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed