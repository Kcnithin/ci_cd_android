name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Java
      # ----------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ----------------------------------------------
      # Android SDK
      # ----------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || true

      # ----------------------------------------------
      # Google Auth (for Play API)
      # ----------------------------------------------
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAYSTORE_JSON }}

      # ----------------------------------------------
      # Get next versionCode
      # ----------------------------------------------
      - name: Get Next Version Code
        id: next_version
        run: |
          EDIT_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $(gcloud auth application-default print-access-token)" \
            -H "Content-Type: application/json" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.cicd.seeroo_sample/edits" \
            -d '{}')

          EDIT_ID=$(echo $EDIT_RESPONSE | jq -r '.id')

          TRACK_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $(gcloud auth application-default print-access-token)" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.cicd.seeroo_sample/edits/$EDIT_ID/tracks/internal")

          VERSION_CODE=$(echo $TRACK_RESPONSE | jq -r '.releases[0].versionCodes[0]')

          if [ "$VERSION_CODE" = "null" ] || [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=1
          else
            VERSION_CODE=$((VERSION_CODE + 1))
          fi

          echo "Next version code: $VERSION_CODE"
          echo "nextVersionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

      # ----------------------------------------------
      # Decode Keystore
      # ----------------------------------------------
      - name: Decode Keystore
        run: |
          mkdir -p keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystores/cicd-keystore.jks

      # ----------------------------------------------
      # Setup Play Store JSON
      # ----------------------------------------------
      - name: Setup Play Store JSON
        run: |
          echo '${{ secrets.PLAYSTORE_JSON }}' > play-store-key.json
          cat play-store-key.json | jq .

      # ----------------------------------------------
      # Gradle Setup
      # ----------------------------------------------
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ----------------------------------------------
      # Clean
      # ----------------------------------------------
      - name: Clean
        run: ./gradlew clean
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ----------------------------------------------
      # Build AAB
      # ----------------------------------------------
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --info
        env:
          KEYSTORE_PATH: keystores/cicd-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.next_version.outputs.nextVersionCode }}

      # ----------------------------------------------
      # Verify
      # ----------------------------------------------
      - name: Ensure AAB exists
        run: ls -R app/build/outputs/bundle/release

      # ----------------------------------------------
      # Upload
      # ----------------------------------------------
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed