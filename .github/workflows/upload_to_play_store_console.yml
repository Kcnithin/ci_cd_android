name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store Track"
        required: true
        default: "internal"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # ✅ Decode Keystore (Windows safe)
      - name: Decode Keystore
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("app/keystore.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      # ✅ Decode Play Store JSON
      - name: Decode Play Store JSON
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("play-store-key.json", [Convert]::FromBase64String("${{ secrets.PLAY_STORE_JSON_KEY }}"))

      # ✅ Create local.properties
      - name: Create local.properties
        shell: pwsh
        run: |
          echo "sdk.dir=$env:ANDROID_HOME" > local.properties

      # ✅ Ensure gradlew runs
      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ Verify keystore exists (debug)
      - name: Verify keystore
        shell: pwsh
        run: |
          Get-ChildItem app

      # ✅ Get latest versionCode from Play Store
      - name: Get latest version code
        id: version
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          track: internal
          status: draft
        continue-on-error: true

      # ✅ Increment versionCode (Windows safe + fallback)
      - name: Increment version code
        shell: pwsh
        run: |
          $versionCode = "${{ steps.version.outputs.versionCode }}"
          if (-not $versionCode) {
            $versionCode = 1
          }
          $newVersionCode = [int]$versionCode + 1
          echo "VERSION_CODE=$newVersionCode" >> $env:GITHUB_ENV

      # ✅ Build AAB (with correct keystore path)
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ✅ Verify AAB exists
      - name: Verify AAB
        shell: pwsh
        run: |
          Get-ChildItem app/build/outputs/bundle/release

      # ✅ Upload to Play Store
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.cicd.seeroo_sample
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed